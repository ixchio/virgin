name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate Ubuntu 22.04+ AppImage
        run: ./tools/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: virgin-linux-x86_64
          path: dist/Virgin-*-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows x64 ZIP
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt with WebEngine
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel
      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure, build, and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-windows -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release -DVIRGIN_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-windows --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-windows --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create portable Windows package
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+([^\s]+)').Matches[0].Groups[1].Value
          $package = Join-Path $PWD "dist/Virgin-$version-win64"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          cmake --install build-windows --prefix $package
          $exe = Get-ChildItem -Path $package -Filter virgin.exe -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw 'Virgin executable was not installed into the Windows package.' }
          windeployqt.exe --release --no-translations --compiler-runtime $exe.FullName
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath "dist/Virgin-$version-win64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: virgin-windows-x86_64
          path: dist/Virgin-*-win64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: virgin-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: virgin-windows-x86_64
          path: dist
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.zip
